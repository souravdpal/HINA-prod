<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HINA · Listening</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --border: #2a3441;
    --text: #e6edf3;
    --muted: #7d8590;
    --accent: #3ddad7;
    --warn: #e3b341;
    --error: #f87171;
    --ok: #3ddad7;
    --radius: 14px;
    --mono: 'SF Mono', 'Cascadia Code', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(circle at 50% -10%, #172029 0%, var(--bg) 60%);
    color: var(--text);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }

  .brand .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.25s, box-shadow 0.25s;
    flex-shrink: 0;
  }

  .brand .dot.pulse {
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(61, 218, 215, 0.5); }
    50% { box-shadow: 0 0 0 6px rgba(61, 218, 215, 0); }
  }

  .brand h1 {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
  }

  .status-line {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 18px;
    min-height: 18px;
  }

  .status-line.warn { color: var(--warn); }
  .status-line.error { color: var(--error); }
  .status-line.ok { color: var(--ok); }

  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    background: #0b0f14;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  textarea::placeholder { color: #4c5561; }

  textarea:focus {
    border-color: var(--accent);
  }

  textarea:disabled {
    opacity: 0.45;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 14px;
    gap: 12px;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
  }

  button {
    appearance: none;
    border: none;
    background: var(--accent);
    color: #04211f;
    font-weight: 600;
    font-size: 14px;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.15s, background 0.15s;
    flex-shrink: 0;
  }

  button:active:not(:disabled) { transform: scale(0.97); }

  button:disabled {
    background: #232b34;
    color: #5b6470;
    cursor: not-allowed;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    .brand .dot.pulse { animation: none; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="dot" id="statusDot"></span>
      <h1>HINA</h1>
    </div>

    <div class="status-line" id="statusLine">Connecting…</div>

    <textarea id="userInput" placeholder="Type what HINA should hear…" disabled></textarea>

    <div class="row">
      <span class="hint" id="hint">Waiting for connection</span>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

<script>
(function () {
  const statusDot = document.getElementById('statusDot');
  const statusLine = document.getElementById('statusLine');
  const hint = document.getElementById('hint');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');

  let ws = null;
  let reconnectAttempt = 0;
  let reconnectTimer = null;
  let heartbeatTimer = null;
  let heartbeatTimeout = null;
  let registered = false;

  // Auto-detect ws:// vs wss:// from the page's own protocol. This is the
  // fix for connections that "never connect" over ngrok or any HTTPS tunnel:
  // a page loaded over https must use wss, or the browser silently blocks
  // the socket as mixed content with no visible error.
  function wsUrl() {
    const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    return proto + window.location.host;
  }

  function setState(kind, text) {
    statusLine.className = 'status-line' + (kind ? ' ' + kind : '');
    statusLine.textContent = text;
  }

  function setDotPulsing(on) {
    statusDot.classList.toggle('pulse', on);
  }

  function setListening(on) {
    input.disabled = !on;
    sendBtn.disabled = !on;
    hint.textContent = on ? 'HINA is listening' : (registered ? 'Registered — waiting for trigger' : 'Waiting for connection');
  }

  function clearHeartbeat() {
    if (heartbeatTimer) clearInterval(heartbeatTimer);
    if (heartbeatTimeout) clearTimeout(heartbeatTimeout);
    heartbeatTimer = null;
    heartbeatTimeout = null;
  }

  function startHeartbeat() {
    clearHeartbeat();
    heartbeatTimer = setInterval(() => {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({ type: 'client_ping' }));
      // If we don't hear back in time, the connection is dead even though
      // it may still look "open" — force a reconnect instead of hanging.
      heartbeatTimeout = setTimeout(() => {
        statusDot.style.background = '#e3b341';
        setState('warn', 'Connection unresponsive — reconnecting…');
        ws.close();
      }, 6000);
    }, 15000);
  }

  function scheduleReconnect() {
    clearHeartbeat();
    registered = false;
    setListening(false);
    const delay = Math.min(1000 * Math.pow(1.6, reconnectAttempt), 15000);
    reconnectAttempt++;
    setState('warn', `Disconnected — retrying in ${Math.round(delay / 1000)}s…`);
    statusDot.style.background = 'var(--warn)';
    setDotPulsing(false);
    reconnectTimer = setTimeout(connect, delay);
  }

  function connect() {
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    setState('', 'Connecting…');
    statusDot.style.background = 'var(--muted)';
    setDotPulsing(true);

    try {
      ws = new WebSocket(wsUrl());
    } catch (e) {
      scheduleReconnect();
      return;
    }

    ws.onopen = () => {
      reconnectAttempt = 0;
      ws.send(JSON.stringify({ type: 'register' }));
      setState('', 'Connected. Registering…');
    };

    ws.onmessage = (e) => {
      let data;
      try { data = JSON.parse(e.data); } catch (err) { return; }

      if (data.type === 'registered') {
        registered = true;
        statusDot.style.background = 'var(--ok)';
        setState('ok', 'Ready — waiting for HINA to trigger');
        setListening(false);
        startHeartbeat();
      } else if (data.type === 'hina_ready') {
        setState('ok', 'HINA is listening');
        setListening(true);
        input.focus();
      } else if (data.type === 'ack') {
        setState('ok', 'Sent — waiting for next trigger');
      } else if (data.type === 'client_pong') {
        if (heartbeatTimeout) { clearTimeout(heartbeatTimeout); heartbeatTimeout = null; }
      }
    };

    ws.onerror = () => {
      // onclose fires right after this; let it own the reconnect logic.
    };

    ws.onclose = () => {
      scheduleReconnect();
    };
  }

  function sendText() {
    if (!ws || ws.readyState !== WebSocket.OPEN || input.disabled) return;
    const text = input.value.trim();
    if (!text) return;
    ws.send(JSON.stringify({ type: 'text_input', text }));
    input.value = '';
    setListening(false);
    setState('', 'Sent. Waiting for response…');
  }

  sendBtn.addEventListener('click', sendText);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText();
    }
  });

  window.addEventListener('online', () => {
    if (!ws || ws.readyState === WebSocket.CLOSED) connect();
  });

  connect();
})();
</script>
</body>
</html>
